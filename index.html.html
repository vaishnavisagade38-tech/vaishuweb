<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Notes</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #4f46e5;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 8px;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .note-form {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .note-form h2 {
            margin-bottom: 15px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
            resize: none;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
        }

        button:hover {
            background: #3730a3;
        }

        .search {
            margin-bottom: 20px;
        }

        .notes {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .note-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .note-card h3 {
            color: #4f46e5;
            margin-bottom: 8px;
        }

        .note-card .subject {
            font-size: 14px;
            color: #777;
            margin-bottom: 12px;
        }

        .note-card p {
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .delete-btn {
            background: #dc2626;
        }

        .delete-btn:hover {
            background: #991b1b;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>📚 Student Notes</h1>
        <p>Save and manage your study notes easily</p>
    </header>

    <div class="container">

        <div class="note-form">
            <h2>Add New Note</h2>

            <input type="text" id="title" placeholder="Enter note title">

            <select id="subject">
                <option value="">Select Subject</option>
                <option value="Cloud Computing">Cloud Computing</option>
                <option value="Software Engineering">Software Engineering</option>
                <option value="Operating System">Operating System</option>
                <option value="Computer Network">Computer Network</option>
                <option value="Java">Java</option>
                <option value="Other">Other</option>
            </select>

            <textarea id="content" placeholder="Write your notes here..."></textarea>

            <button onclick="addNote()">Add Note</button>
        </div>

        <div class="search">
            <input
                type="text"
                id="search"
                placeholder="🔍 Search notes..."
                onkeyup="displayNotes()"
            >
        </div>

        <div id="notesList" class="notes"></div>

    </div>

    <script>

        let notes = JSON.parse(localStorage.getItem("studentNotes")) || [];

        function addNote() {

            let title = document.getElementById("title").value;
            let subject = document.getElementById("subject").value;
            let content = document.getElementById("content").value;

            if (title === "" || subject === "" || content === "") {
                alert("Please fill all fields!");
                return;
            }

            let note = {
                id: Date.now(),
                title: title,
                subject: subject,
                content: content
            };

            notes.push(note);

            localStorage.setItem("studentNotes", JSON.stringify(notes));

            document.getElementById("title").value = "";
            document.getElementById("subject").value = "";
            document.getElementById("content").value = "";

            displayNotes();
        }

        function displayNotes() {

            let notesList = document.getElementById("notesList");
            let searchText = document.getElementById("search").value.toLowerCase();

            notesList.innerHTML = "";

            let filteredNotes = notes.filter(note =>
                note.title.toLowerCase().includes(searchText) ||
                note.subject.toLowerCase().includes(searchText) ||
                note.content.toLowerCase().includes(searchText)
            );

            if (filteredNotes.length === 0) {
                notesList.innerHTML =
                    '<div class="empty">No notes found.</div>';
                return;
            }

            filteredNotes.forEach(note => {

                let card = document.createElement("div");

                card.className = "note-card";

                card.innerHTML = `
                    <h3>${note.title}</h3>
                    <div class="subject">📖 ${note.subject}</div>
                    <p>${note.content}</p>

                    <button class="delete-btn"
                        onclick="deleteNote(${note.id})">
                        Delete
                    </button>
                `;

                notesList.appendChild(card);
            });
        }

        function deleteNote(id) {

            if (confirm("Are you sure you want to delete this note?")) {

                notes = notes.filter(note => note.id !== id);

                localStorage.setItem(
                    "studentNotes",
                    JSON.stringify(notes)
                );

                displayNotes();
            }
        }

        displayNotes();

    </script>

</body>
</html>
